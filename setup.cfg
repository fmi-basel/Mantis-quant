[metadata]
name = mantis-quant
description = Quantitative measurements and mesh analysis tasks for Fractal.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/fmi-basel/Mantis-quant
author = Nicole Repina
author_email = nicole.repina@fmi.ch
license = BSD-3-Clause
license_file = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: BSD License
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3.11
project_urls =
    Bug Tracker = https://github.com/fmi-basel/Mantis-quant/issues
    Documentation = https://github.com/fmi-basel/Mantis-quant#README.md
    Source Code = https://github.com/fmi-basel/Mantis-quant
    User Support = https://github.com/fmi-basel/Mantis-quant/issues

[options]
# TODO: fix issue 104 and remove numpy version requirement
# TODO: fix pyshtools dependency issue on UZH cluster
packages = find:
install_requires =
    dask==2025.9.1
    dask-image
    numpy<2
    pandas<3.0.0
    pyshtools
    scikit-image>=0.21.0
    scikit-learn
    scipy
    tqdm
    vtk==9.3.1
    anndata
    fractal-tasks-core==1.3.4
    fractal-task-tools>=0.3.0,<0.4.0
    ngio==0.2.14
python_requires = >=3.11
package_dir =
    = src
setup_requires =
    setuptools-scm

[options.packages.find]
where = src

[options.extras_require]
test =
    pytest
    pytest-cov
    pooch
    devtools

[options.package_data]
mantis_quant = __FRACTAL_MANIFEST__.json
